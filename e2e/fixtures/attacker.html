<!doctype html>
<html>
<body>
<script>
    // Mirrors the PoC from the bug bounty report: obtain a window reference to
    // the victim page, then postMessage into it from a genuinely different origin/window.
    window.__openTarget = (url) => {
        window.__target = window.open(url);
    };

    window.__attack = (type, payload) => {
        window.__target.postMessage({ type, payload }, '*');
    };
</script>
</body>
</html>
