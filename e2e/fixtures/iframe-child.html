<!doctype html>
<html>
<body>
<div id="log"></div>
<script type="module">
    import { Observe } from '/lib/index.esm.js';

    const parentOrigin = new URLSearchParams(location.search).get('parentOrigin');
    const observe = new Observe({ parentOrigin });

    observe.proctorioStatusResponse((data) => {
        document.getElementById('log').textContent += `status:${JSON.stringify(data)};`;
    });

    window.__requestStatus = () => observe.proctorioStatusRequest(parentOrigin);
</script>
</body>
</html>
