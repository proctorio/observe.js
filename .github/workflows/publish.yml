name: publish

# Canonical source of this workflow is the ADO Open repo; sync mirrors it to GitHub.
# Publishes to npmjs via OIDC trusted publishing (no tokens). Version comes from the release tag.

on:
  push:
    tags:
      - "release/*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      # trusted publishing needs a current npm cli
      - run: npm install -g npm@latest
      - name: Set version from the release tag
        run: npm version "${GITHUB_REF_NAME#release/}" --no-git-tag-version --allow-same-version
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm publish --access public
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "v${GITHUB_REF_NAME#release/}" --generate-notes || echo "release already exists"
